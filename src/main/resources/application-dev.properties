# 開發環境配置
server.port=8080
logging.level.com.example=DEBUG

#  資料庫連線設定（請自行修改 your_database_name）
spring.datasource.url=jdbc:mysql://localhost:3306/sample_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=mydba
spring.datasource.password=dbapasswd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 核心設定
# update: 啟動時自動根據 Entity 建立或修正資料表（開發期好用，生產環境建議改為 validate 或 none）
spring.jpa.hibernate.ddl-auto=update
# 讓控制台印出執行中的 SQL 語句
spring.jpa.show-sql=true
# 格式化印出的 SQL 語句，使其更容易閱讀
spring.jpa.properties.hibernate.format_sql=true
